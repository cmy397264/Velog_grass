name: Update velog grass

on:
  schedule:
    # 매일 한국 시간 오전 6시 (UTC 21:00)
    - cron: '0 21 * * *'
  workflow_dispatch: # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate grass.svg
        run: node scripts/generate.mjs
        env:
          VELOG_USER: cmy397264
          OUT: grass.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grass.svg
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: update velog grass"
            git push
            # jsDelivr 캐시를 비워서 velog 글에 바로 반영되도록 함
            curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/grass.svg" || true
          fi
